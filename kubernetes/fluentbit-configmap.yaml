apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: kube-system
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Daemon       Off
        Log_Level    info
        Parsers_File /fluent-bit/etc/parsers.conf

    [INPUT]
        Name   tail
        Path   /var/log/containers/*.log
        Parser docker
        Tag    kube.*
        DB     /var/log/flb_kube.db
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On

    [OUTPUT]
        Name   cloudwatch
        Match  *
        region us-west-2
        log_group_name fluent-bit-logs
        log_stream_prefix from-fluent-bit-
        auto_create_group true
        log_key message
        log_retention_days 30

    [FILTER]
        Name   kubernetes
        Match  *
        Kube_URL https://kubernetes.default.svc:443
        Merge_Log On
        Keep_Log Off
        Annotations Off
        Labels Off
